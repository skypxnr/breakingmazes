<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ideas — Breaking Mazes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <section class="section" style="padding:52px 0 32px">
    <div class="container">
      <div class="eyebrow mb-16">Navigate by Theme</div>
      <h1 style="font-size:clamp(40px,5.5vw,72px)">Ideas</h1>
      <p class="muted mt-16" style="max-width:660px;font-size:16px">
        Every conversation is a doorway. Enter through the idea that pulls you in.
      </p>
    </div>
  </section>

  <!-- Theme tile grid -->
  <section class="section" style="padding:24px 0 40px">
    <div class="container">
      <div class="grid grid-4" id="ideaTiles" style="gap:1px;background:var(--line);border:1px solid var(--line)"></div>
    </div>
  </section>

  <!-- Selected theme -->
  <section class="section" style="padding:24px 0 40px">
    <div class="container">
      <div class="between center mb-24" style="display:flex;padding-bottom:14px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap">
        <div>
          <div class="eyebrow mb-8">Now viewing</div>
          <h2 id="selectedThemeName" style="font-size:32px">All Themes</h2>
        </div>
        <span class="eyebrow" id="selectedThemeCount">0 sessions</span>
      </div>
      <div class="grid grid-3" id="themeSessions"></div>
    </div>
  </section>

  <!-- Related themes strip -->
  <section class="section" style="background:var(--navy-2);border-top:1px solid var(--line)">
    <div class="container">
      <div class="section-head"><h2>Popular Combinations</h2><span class="num">Cross-Theme</span></div>
      <div class="grid grid-3" id="combos"></div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(async () => {
  BM.injectHeader('ideas');
  BM.injectFooter();
  const d = await BM.load();

  const urlTheme = new URLSearchParams(location.search).get('theme');
  let current = urlTheme || '';

  function renderTiles(){
    document.getElementById('ideaTiles').innerHTML = d.themes.map((t, i) => {
      const count = d.sessions.filter(s => s.themes.includes(t.id) && s.status === 'published').length;
      const active = current === t.id;
      return `
        <a href="#" class="idea-tile" data-theme="${t.id}"
           style="background:${active ? 'var(--deep)' : 'var(--navy-2)'};padding:28px 22px;min-height:150px;
                  display:flex;flex-direction:column;justify-content:space-between;transition:.25s">
          <span class="eyebrow">${String(i+1).padStart(2,'0')}</span>
          <div>
            <h4 style="font-size:24px;margin-bottom:6px">${t.name}</h4>
            <div class="eyebrow">${count} session${count === 1 ? '' : 's'}</div>
          </div>
        </a>`;
    }).join('');

    document.querySelectorAll('[data-theme]').forEach(el => {
      el.onclick = e => {
        e.preventDefault();
        current = el.dataset.theme === current ? '' : el.dataset.theme;
        history.replaceState({}, '', current ? `?theme=${current}` : location.pathname);
        renderTiles(); renderSessions();
      };
    });
  }

  function renderSessions(){
    const t = current ? BM.theme(current) : null;
    document.getElementById('selectedThemeName').textContent = t ? t.name : 'All Themes';

    let list = BM.publishedSessions();
    if(current) list = list.filter(s => s.themes.includes(current));

    document.getElementById('selectedThemeCount').textContent =
      `${list.length} session${list.length === 1 ? '' : 's'}`;

    document.getElementById('themeSessions').innerHTML = list.length
      ? list.map(BM.cardHTML.bind(BM)).join('')
      : `<div style="grid-column:1/-1;padding:56px;text-align:center;border:1px dashed var(--line)">
           <p class="muted">No sessions yet for this theme.</p>
         </div>`;
  }

  // Cross-theme combos
  function renderCombos(){
    const pairs = [
      ['education','ai'],
      ['governance','leadership'],
      ['innovation','entrepreneurship']
    ];
    document.getElementById('combos').innerHTML = pairs.map(([a,b]) => {
      const list = d.sessions.filter(s => s.status==='published' && s.themes.includes(a) && s.themes.includes(b));
      const ta = BM.theme(a)?.name, tb = BM.theme(b)?.name;
      return `
        <a href="conversations.html" class="card" style="padding:24px">
          <div class="eyebrow mb-8">${ta} × ${tb}</div>
          <h4 style="font-size:22px;margin-bottom:12px">${list.length} session${list.length===1?'':'s'}</h4>
          <p class="small muted">Explore the intersection.</p>
        </a>`;
    }).join('');
  }

  renderTiles(); renderSessions(); renderCombos();
})();
</script>
</body>
</html>

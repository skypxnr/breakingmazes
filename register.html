<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Register — Breaking Mazes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head><body>
<div class="auth-shell">
  <div class="auth-visual">
    <div class="brand">Breaking <span>Mazes</span></div>
    <div>
      <h1>Enter the <em>conversation.</em></h1>
      <p>Register to follow sessions, submit questions, and access the full archive.</p>
    </div>
  </div>
  <div class="auth-form">
    <div class="auth-card">
      <h2>Create account</h2>
      <p class="sub">Choose how you'll participate.</p>
      <div id="alert"></div>
      <form id="regForm">
        <div class="role-grid">
          <div class="role-opt active" data-role="student"><span class="t">Student</span><span class="d">Attend &amp; ask</span></div>
          <div class="role-opt" data-role="editor"><span class="t">Editor</span><span class="d">Manage content</span></div>
        </div>
        <div class="form-group"><label>Full Name</label><input name="name" class="form-control" required></div>
        <div class="form-group"><label>Email</label><input name="email" type="email" class="form-control" required></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" class="form-control" required minlength="6"></div>
        <button type="submit" class="btn btn-gold btn-block">Create Account</button>
      </form>
      <div class="auth-switch">Have an account? <a href="login.html">Sign In</a></div>
    </div>
  </div>
</div>
<script src="assets/js/auth.js"></script>
<script>
let selectedRole = 'student';
document.querySelectorAll('.role-opt').forEach(el => el.addEventListener('click', () => {
  document.querySelectorAll('.role-opt').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  selectedRole = el.dataset.role;
}));
document.getElementById('regForm').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  await Auth.register({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password'), role: selectedRole });
  location.href = selectedRole === 'student' ? 'index.html' : 'admin/index.html';
});
</script>
</body></html>

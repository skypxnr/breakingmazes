<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Breaking Mazes — A Leadership Dialogue Series</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<script src="assets/js/config.js"></script>
<main>
  <section class="hero-poster">
    <div class="container hero-grid" id="heroGrid"></div>
  </section>

  <section class="section">
    <div class="container-n tc">
      <div class="eyebrow mb-16">The Idea</div>
      <h2 style="font-style:italic;font-weight:400;line-height:1.3">
        “Every institution is a maze. <span class="gold">Navigation is a discipline</span> — best learned from those who have walked it.”
      </h2>
      <div style="width:48px;height:1px;background:var(--gold);margin:24px auto 0"></div>
    </div>
  </section>

  <section class="section" style="background:var(--navy-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
    <div class="container">
      <div class="section-head">
        <h2>Featured Conversation</h2>
        <a href="conversations.html" class="num">All Sessions →</a>
      </div>
      <div class="poster" id="featuredPoster"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><h2>The Conversations</h2><span class="num">Archive</span></div>
      <div class="grid grid-3" id="sessionGrid"></div>
    </div>
  </section>

  <section class="section" style="background:var(--navy-2);border-top:1px solid var(--line)">
    <div class="container">
      <div class="section-head"><h2>The Ideas</h2><span class="num">Navigate by Theme</span></div>
      <div class="grid grid-4" id="themeGrid"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><h2>Voices</h2><span class="num">The People</span></div>
      <div class="grid grid-4" id="voicesGrid"></div>
    </div>
  </section>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(async () => {
  BM.injectHeader('home');
  BM.injectFooter();
  const d = await BM.load();
  if (!d.sessions.length) {
    document.getElementById('heroGrid').innerHTML = '<p class="muted tc">Unable to load sessions. Make sure the server is running.</p>';
    return;
  }

  // HERO — most recent featured session
  const hero = d.sessions.find(s => s.featured && s.status==='published') || d.sessions[0];
  const host = BM.speaker(hero.hostId);
  const guest = BM.speaker(hero.speakerId);
  const words = hero.title.split(' ');
  const mid = Math.ceil(words.length/2);
  document.getElementById('heroGrid').innerHTML = `
    <div class="hero-speaker">
      <img src="${host.photo}" alt="${host.name}">
      <div class="name-block"><div class="name">${host.name}</div><div class="role">${host.role}</div></div>
    </div>
    <div class="hero-center">
      <div class="eyebrow">Session ${String(hero.number).padStart(2,'0')} · Now Streaming</div>
      <div class="q">${words.slice(0,mid).join(' ')}</div>
      <div class="q big">${words.slice(mid).join(' ')}</div>
      ${hero.subtitle ? `<div class="subline">${hero.subtitle}</div>` : ''}
      <div class="cta-row">
        <a href="session.html?id=${hero.id}" class="btn btn-gold">Watch the Latest</a>
        <a href="conversations.html" class="btn btn-outline">Explore All</a>
      </div>
    </div>
    <div class="hero-speaker">
      <img src="${guest.photo}" alt="${guest.name}">
      <div class="name-block"><div class="name">${guest.name}</div><div class="role">${guest.role}</div></div>
    </div>`;

  // FEATURED POSTER
  document.getElementById('featuredPoster').innerHTML = BM.posterHTML(hero);

  // SESSION GRID
  document.getElementById('sessionGrid').innerHTML = BM.publishedSessions().slice(0,6).map(BM.cardHTML.bind(BM)).join('');

  // THEMES
  document.getElementById('themeGrid').innerHTML = d.themes.map(t => {
    const count = d.sessions.filter(s => s.themes.includes(t.id) && s.status==='published').length;
    return `<a href="ideas.html?theme=${t.id}" class="card" style="padding:28px 22px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between">
      <span class="eyebrow">${String(count).padStart(2,'0')} sessions</span>
      <h4 style="font-size:24px;margin-top:12px">${t.name}</h4>
    </a>`;
  }).join('');

  // VOICES
  document.getElementById('voicesGrid').innerHTML = d.speakers.filter(s => !s.isHost).slice(0,4).map(sp => `
    <a href="voices.html" class="card">
      <div class="card-img" style="aspect-ratio:4/5"><img src="${sp.photo}" alt="${sp.name}"></div>
      <div class="card-body"><h4>${sp.name}</h4><div class="role">${sp.role}</div></div>
    </a>`).join('');
})();
</script>
</body>
</html>
